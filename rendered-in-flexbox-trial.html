<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Multiplication Table</title>
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <meta name="viewport" content="width=device~width, initial-scale=1.0">

    <style>
        section.rows-of-columns {
            border: 1px solid black;
            padding: 4px;

            div.rows {
                display: flex;
                justify-content: space-between;
                border: 1px solid black;
                padding: 4px;
                background: blanchedalmond;

                div {
                    border: 1px solid black;
                    background-color: lightblue;

                }
            }
        }
    </style>

</head>
<body>

<section class="container">
    <h1>Flex-Box Multipulcation Table Project</h1>
    <h3>Create your own multiplication table that is rendered with Flexbox</h3>

    <div class="generate-box">
        <div class="inputs">
            <label for="rows">Rows:
                <input id="rows" type="number" value="10" placeholder="How many rows?"/>
            </label>

            <label for="cols">Cols:
                <input id="cols" type="number" value="10" placeholder="How many columns?"/>
            </label>
        </div>

        <button id="generate" onclick="createWithFlexbox(getRowdesired(), getColumnsDesired())"Generate!</button>
    </div>

    <div id="output"></div>
</section>

</body>
<script src="javascript.js"</script>
</html>
